<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Expense Tracker</title>
    <meta
    name="description"
    content="A simple student expense tracker for managing expenses, budgets, categories, and spending."
>
<link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>"
>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Expense Tracker 💰</h1>
<p class="subtitle">Track your spending and manage your monthly budget.</p>

        <!-- Dashboard -->
        <div class="dashboard">

            <div class="dashboard-card">
                <h3>Total Spent</h3>
                <p>₹<span id="dashboardTotal">0</span></p>
            </div>

            <div class="dashboard-card">
                <h3>This Month</h3>
                <p>₹<span id="monthlyTotal">0</span></p>
            </div>

            <div class="dashboard-card">
                <h3>Remaining</h3>
                <p><span id="remainingBalance">₹0</span></p>
            </div>

        </div>
        <p id="budgetWarning"></p>

        <!-- Monthly Budget -->
<div class="budget-container">

    <div class="form-group">

        <label for="budget">
            Monthly Budget
        </label>

        <input
            type="number"
            id="budget"
            placeholder="e.g. 10000"
        >

        <button id="saveBudgetBtn">
            Set Budget
        </button>

    </div>

</div>

        <!-- Add Expense -->
    <h2>Add Expense</h2>

<div class="form-container">

<div class="form-group">

            <label for="expenseName">
                Expense Name
            </label>

         <div class="name-input-area">

    <input
        type="text"
        id="expenseName"
        placeholder="e.g. Lunch"
        maxlength="50"
    >

    <p id="nameCharCount">0 / 50 characters</p>

</div>
        </div>


        <div class="form-group">

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="e.g. 120"
            >

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select id="category">

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">
                    Entertainment
                </option>
                <option value="Other">Other</option>

            </select>

        </div>


        <div class="form-group">

            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
            >

        </div>


        <button id="addExpenseBtn">
            Add Expense
        </button>
        <button id="resetFormBtn">
    Reset Form
</button>
    <p id="successMessage"></p>
    </div>

        <!-- Category Summary -->
        <h2 class="section-title">
            Category Summary
        </h2>

        <div id="categorySummary"></div>
        <h2 class="section-title">Spending Chart</h2>

<canvas id="spendingChart"></canvas>


       <div class="expense-history-header">

    <h2>Expense History</h2>

    <p id="expenseCount">0</p>

</div>


        <!-- Category Filter -->
<select id="categoryFilter">

    <option value="All">
        All Categories
    </option>

    <option value="Food">
        Food
    </option>

    <option value="Travel">
        Travel
    </option>

    <option value="Shopping">
        Shopping
    </option>

    <option value="Entertainment">
        Entertainment
    </option>

    <option value="Other">
        Other
    </option>

</select>


<!-- Search Expenses -->
<div class="search-input-area">

    <input
        type="text"
        id="searchInput"
        placeholder="Search expenses..."
        maxlength="50"
    >

    <p id="searchCharCount">0 / 50 characters</p>

</div>

<button id="clearSearchBtn">
    Clear Search
</button>


<button id="clearAllBtn">
    Clear All Expenses
</button>
<button id="exportCsvBtn">
    Export CSV
</button>
<p id="filteredTotal">
    Filtered Total: ₹0
</p>

<div id="expenseList"></div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>

</html>
